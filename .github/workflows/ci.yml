name: CI

on:
  push:
    branches: [main]
  pull_request:
  public:

permissions:
  contents: read

jobs:
  test:
    name: test (ubuntu-latest, bun ${{ matrix.bun }})
    # Standard runners are free for public repositories; never spend private-repository minutes.
    if: ${{ github.event.repository.visibility == 'public' }}
    runs-on: ubuntu-latest
    # The pinned Bun matches @types/bun; latest gives early warning for the next upgrade.
    continue-on-error: ${{ matrix.bun == 'latest' }}
    strategy:
      fail-fast: false
      matrix:
        bun: ["1.2.15", latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ matrix.bun }}
      - name: Git identity for the git tests
        run: |
          git config --global user.name "CI"
          git config --global user.email "ci@example.com"
          git config --global init.defaultBranch main
      - run: bun install --frozen-lockfile
      - run: bun run typecheck
      - run: bun test
